<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Parking Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Car Parking Management System</h1>

    <section class="cards" id="stats">
      <article><h2 id="totalSlots">0</h2><p>Total Slots</p></article>
      <article><h2 id="occupiedSlots">0</h2><p>Occupied</p></article>
      <article><h2 id="availableSlots">0</h2><p>Available</p></article>
    </section>

    <section class="actions">
      <form id="checkInForm">
        <h3>Vehicle Check-In</h3>
        <input type="text" id="vehicleNumber" placeholder="Vehicle Number" required />
        <button type="submit">Check In</button>
      </form>

      <form id="checkOutForm">
        <h3>Vehicle Check-Out</h3>
        <input type="text" id="ticketId" placeholder="Ticket ID" required />
        <button type="submit">Check Out</button>
      </form>
    </section>

    <section>
      <h3>Slots Overview</h3>
      <div id="slots" class="slot-grid"></div>
    </section>

    <section>
      <h3>Latest Activity</h3>
      <pre id="message"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
